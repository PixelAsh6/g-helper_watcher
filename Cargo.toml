[package]
name = "ghelper-watcher"
version = "1.0.0"
edition = "2021"
authors = ["Nițică Dragoș-Marian"]
description = "Tray-first background daemon that auto-switches G-Helper profiles on process lifecycle events"
license = "MIT"

[[bin]]
name = "ghelper-watcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = "0.32"
tray-icon = "0.20"
winreg = "0.55"
notify = "6.1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
wmi = "0.14"
# Native Windows APIs (WMI / windowing / foundation / console / synthetic input / admin)
windows = { version = "0.58", features = ["Win32_System_Wmi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Security", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
overflow-checks = false
